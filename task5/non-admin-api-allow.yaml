# Task5: Kubernetes NetworkPolicies for separating admin/non-admin traffic
# Assumptions:
# - All pods run in the SAME namespace.
# - Pods are labeled exactly as in the assignment:
#     role=front-end
#     role=back-end-api
#     role=admin-front-end
#     role=admin-back-end-api
#
# Notes for Minikube:
# - NetworkPolicy requires a CNI that enforces it (e.g., Calico/Cilium).
#   In Minikube you can start with:  minikube start --cni=calico
#
# Quick test examples:
#   # Allowed: front-end -> back-end-api
#   kubectl run test-fe --rm -it --restart=Never --image=alpine --labels role=front-end -- sh
#   / # apk add --no-cache wget
#   / # wget -qO- --timeout=2 http://back-end-api-app
#
#   # Blocked: front-end -> admin-back-end-api
#   / # wget -qO- --timeout=2 http://admin-back-end-api-app
#
#   # Allowed: admin-front-end -> admin-back-end-api
#   kubectl run test-admin-fe --rm -it --restart=Never --image=alpine --labels role=admin-front-end -- sh
#   / # apk add --no-cache wget
#   / # wget -qO- --timeout=2 http://admin-back-end-api-app
#
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-front-end-to-back-end-api
spec:
  podSelector:
    matchLabels:
      role: back-end-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: front-end
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-back-end-api-to-front-end
spec:
  podSelector:
    matchLabels:
      role: front-end
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: back-end-api
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-front-end-to-admin-back-end-api
spec:
  podSelector:
    matchLabels:
      role: admin-back-end-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: admin-front-end
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-back-end-api-to-admin-front-end
spec:
  podSelector:
    matchLabels:
      role: admin-front-end
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: admin-back-end-api
      ports:
        - protocol: TCP
          port: 80
