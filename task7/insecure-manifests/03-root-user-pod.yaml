apiVersion: v1
kind: Pod
metadata:
  name: pod-root
  namespace: audit-zone
spec:
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
  containers:
    - name: busy
      image: busybox:1.36
      command: ["sh","-c","sleep 3600"]
      securityContext:
        readOnlyRootFilesystem: false
