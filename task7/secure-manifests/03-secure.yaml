apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-nonroot
  namespace: audit-zone
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: busy
      image: busybox:1.36
      command: ["sh","-c","sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
